# Notification Service - Local configuration (will be overridden by config-server)
# This file can be used for local development overrides

spring:
  kafka:
    bootstrap-servers: localhost:9092  # Using the external port 9092 that's mapped to Kafka's internal 9092
    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.ecommerce.notificationservice.dto"
        spring.json.use.type.headers: false
    properties:
      security.protocol: PLAINTEXT
    listener:
      ack-mode: MANUAL_IMMEDIATE
      missing-topics-fatal: false

# Uncomment and modify for local development if needed
#   datasource:
#     url: jdbc:mysql://localhost:3306/ecommerce_notificationdb?createDatabaseIfNotExist=true
#     username: root
#     password: drowssap

# Kafka topic configuration
kafka:
  topic:
    notifications: notifications
  consumer:
    concurrency: 1  # Reduce concurrency to 1 for local development
    poll-timeout: 5000
    auto-startup: true

# Logging configuration
logging:
  level:
    org.springframework.kafka: DEBUG
    org.apache.kafka: DEBUG
    org.apache.kafka.clients.consumer.internals: DEBUG
    com.ecommerce.notificationservice.service.NotificationConsumerService: DEBUG